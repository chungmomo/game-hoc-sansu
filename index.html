<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>おひめさまの さんすう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" id="sky"></div>

<!-- ============ LOADING SCREEN ============ -->
<section id="screen-loading" class="screen active">
  <div class="loading-wrap">
    <div class="loading-spinner" aria-hidden="true">👑</div>
    <p class="loading-text">じゅんびちゅう…</p>
  </div>
</section>

<!-- ============ PROFILE PICKER SCREEN ============ -->
<section id="screen-profiles" class="screen">
  <div class="home-header">
    <div class="castle-top" aria-hidden="true">🏰</div>
    <h1 class="title">
      <span class="title-crown">👑</span>
      だれが あそぶ？
      <span class="title-crown">👑</span>
    </h1>
  </div>
  <div class="panel">
    <div class="profile-grid" id="profile-grid"></div>
    <button class="btn-start" id="btn-add-profile">＋ あたらしい こを つくる</button>
    <button class="btn-mini" id="btn-link-profile">🔑 べつの きき の コードで つづける</button>
  </div>
</section>

<!-- ============ HOME SCREEN ============ -->
<section id="screen-home" class="screen">
  <div class="home-header">
    <div class="castle-top" aria-hidden="true">🏰</div>
    <h1 class="title">
      <span class="title-crown">👑</span>
      おひめさまの さんすう
      <span class="title-crown">👑</span>
    </h1>
    <p class="subtitle">まいひめが ようかいに つかまった！まほうの けいさんで たたかって にげだそう！</p>

    <div class="top-actions">
      <div class="star-total-badge" id="star-total-badge">
        <span class="star-ico">⭐</span> <span id="star-total-text">0</span> こ
      </div>
      <button class="sound-toggle" aria-label="おとを けす" aria-pressed="true">🔊</button>
      <button class="icon-btn" id="btn-switch-profile" aria-label="こを かえる">🧒</button>
    </div>

    <button class="btn-start" id="btn-start">
      はじめる ✨
    </button>

    <button class="btn-mini" id="btn-reset">さいしょから やりなおす（きろくを けす）</button>
  </div>

  <div class="panel">
    <h2 class="panel-title">1. けいさんの しゅるいを えらんでね</h2>
    <div class="operation-row" id="operation-row"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title">2. おひめさまを えらんでね</h2>
    <div class="princess-row" id="princess-row"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title">3. むずかしさを えらんでね</h2>
    <div class="level-row" id="level-row"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title">🗝️ ぼうけんの きろく</h2>
    <div class="puzzle-grid" id="puzzle-grid"></div>
    <div class="item-row" id="item-row"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title">🏅 きろく</h2>
    <div class="badge-grid" id="badge-grid"></div>
  </div>
</section>

<!-- ============ GAME SCREEN ============ -->
<section id="screen-game" class="screen">
  <div class="game-top-bar">
    <button class="btn-back" id="btn-back-home" aria-label="さいしょの がめんに もどる">🏠</button>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text"><span id="progress-current">1</span> / <span id="progress-total">10</span></div>
      <div class="timer-wrap" id="timer-wrap">
        <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
      </div>
    </div>
    <div class="lives" id="lives" aria-hidden="true">💖💖💖</div>
    <button class="icon-btn" id="btn-toggle-timer" aria-label="タイマーを けす" aria-pressed="true">⏱️</button>
    <button class="sound-toggle" aria-label="おとを けす" aria-pressed="true">🔊</button>
  </div>

  <div class="mascot-zone">
    <div class="mascot-wrap">
      <div class="mascot" id="mascot">🧚</div>
      <div class="companion-sprite" id="companion-sprite" aria-hidden="true"></div>
      <div class="streak-badge" id="streak-badge" aria-live="polite"></div>
      <div class="hp-bar"><div class="hp-fill" id="mascot-hp-fill"></div></div>
    </div>
    <div class="speech-bubble" id="speech-bubble">がんばって といてみよう！</div>
    <div class="monster-wrap">
      <div class="monster" id="monster-display">👺</div>
      <div class="hp-bar"><div class="hp-fill" id="monster-hp-fill"></div></div>
      <div class="monster-name" id="monster-name"></div>
    </div>
  </div>

  <div class="problem-card">
    <div class="problem-overview" id="problem-overview">
      <span class="overview-label">もんだい</span>
      <div class="overview-numbers">
        <div>6</div>
        <div>+ 8</div>
      </div>
    </div>
    <div class="problem-body">
      <div class="column-table" id="column-table"></div>
      <div class="animal-counters" id="animal-counters"></div>
    </div>
  </div>

  <div class="step-prompt" id="step-prompt">いちのくらい：6 + 8 = ?</div>

  <div class="keypad" id="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key key-clear" data-key="clear" aria-label="けす">⌫</button>
    <button class="key" data-key="0">0</button>
    <button class="key key-submit" data-key="submit" aria-label="こたえを だす">✓</button>
  </div>
</section>

<!-- ============ RESULT SCREEN ============ -->
<section id="screen-result" class="screen">
  <div class="result-card">
    <div class="result-mascot" id="result-mascot">👑</div>
    <h2 class="result-title" id="result-title">できたよ！</h2>
    <div class="result-stars" id="result-stars"></div>
    <p class="result-detail" id="result-detail">10もんちゅう 10もん せいかい</p>
    <p class="result-story" id="result-story"></p>
    <div class="result-buttons">
      <button class="btn-start" id="btn-play-again">もういちど れんしゅう 🔁</button>
      <button class="btn-start btn-secondary" id="btn-next-level">つぎの むずかしさへ ➡️</button>
      <button class="btn-mini" id="btn-go-home">さいしょの がめんに もどる 🏠</button>
    </div>
  </div>
</section>

<div id="confetti-layer"></div>
<div id="sticker-layer"></div>

<!-- ============ TEXT PROMPT MODAL (replaces window.prompt) ============ -->
<div class="modal-overlay" id="prompt-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="prompt-modal-title">
    <p class="modal-title" id="prompt-modal-title"></p>
    <input type="text" class="modal-input" id="prompt-modal-input" autocomplete="off">
    <p class="modal-error hidden" id="prompt-modal-error"></p>
    <div class="modal-buttons">
      <button class="modal-cancel" id="prompt-modal-cancel">キャンセル</button>
      <button class="modal-confirm" id="prompt-modal-confirm">OK</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="src/firebase-config.js"></script>
<script src="src/cloud.js"></script>
<script src="src/math.js"></script>
<script src="src/icons.js"></script>
<script src="src/data.js"></script>
<script src="src/audio.js"></script>
<script src="src/effects.js"></script>
<script src="src/app.js"></script>
</body>
</html>
